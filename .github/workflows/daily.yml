name: Daily brief

on:
  schedule:
    - cron: "17 13 * * *"      # 13:17 UTC = 6:17 AM Pacific (PDT) / 5:17 AM (PST)
  workflow_dispatch:            # "Run workflow" button for a manual run

permissions:
  contents: write               # save today's issue back to the repo (archive + corrections history)
  pages: write
  id-token: write

concurrency:
  group: pdb-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r backend/requirements.txt

      - name: Tests (fact-checker, editor rules, scoring)
        working-directory: backend
        run: python -m pytest -q

      - name: Run the AI newsroom
        working-directory: backend
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >
          python -m synthesis publish
          --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Save today's issue to the archive
        run: |
          git config user.name "PDB Newsroom"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public
          git diff --cached --quiet || git commit -m "Brief for $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
